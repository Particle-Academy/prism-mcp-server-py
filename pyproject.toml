[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism-ai-mcp-server"
version = "0.1.0"
description = "Transport-independent MCP tool serving for the Prism ecosystem."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["prism-ai-mcp==0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/prism_mcp_server"]

[tool.hatch.build.targets.sdist]
include = ["/src/prism_mcp_server", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
